name: security-scan

# Runs the shared multi-model security pipeline from eovidiu/security-pipeline.
# Needs the OPENROUTER_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full runs every stage; chain runs only the stages listed below"
        type: choice
        options: [full, chain]
        default: full
      chain:
        description: "Comma-separated stages for mode=chain (no spaces)"
        type: string
        default: sast,recon,hunt,verify
      recon_model:
        type: string
        default: openrouter/google/gemini-4-hydrogen
      hunt_model:
        type: string
        default: openrouter/google/gemini-4-hydrogen
      verify_model:
        type: string
        default: openrouter/google/gemini-4-hydrogen
      remediate_model:
        type: string
        default: openrouter/google/gemini-4-hydrogen

# Upper bound for the called workflow. Its scanning and AI jobs only get contents/packages read;
# the report job adds issues + security-events, and fix-pr adds contents + pull-requests write.
permissions:
  contents: write
  packages: read
  issues: write
  pull-requests: write
  security-events: write

jobs:
  security-validation:
    uses: eovidiu/security-pipeline/.github/workflows/security-validation.yml@main
    with:
      mode: ${{ inputs.mode }}
      chain: ${{ inputs.chain }}
      recon_model: ${{ inputs.recon_model }}
      hunt_model: ${{ inputs.hunt_model }}
      verify_model: ${{ inputs.verify_model }}
      remediate_model: ${{ inputs.remediate_model }}
    secrets: inherit
